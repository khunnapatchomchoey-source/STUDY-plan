<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planner">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f1115">
<title>Study Planner</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a33;--text:#e8eaed;--muted:#9aa0aa;
--accent:#7c9cff;--green:#4ade80;--red:#f87171;--amber:#fbbf24;
--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{overscroll-behavior-y:none}
body{margin:0;background:var(--bg);background-image:radial-gradient(circle at 15% 0%,rgba(124,156,255,.08),transparent 45%),radial-gradient(circle at 85% 8%,rgba(124,156,255,.05),transparent 40%);background-attachment:fixed;color:var(--text);
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Noto Sans Thai",sans-serif;
-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
padding-left:var(--sl);padding-right:var(--sr)}
header{position:sticky;top:0;z-index:20;background:rgba(15,17,21,.8);backdrop-filter:blur(24px) saturate(1.5);
-webkit-backdrop-filter:blur(24px) saturate(1.5);padding:calc(var(--st) + 14px) 18px 14px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.4px}
.sub{color:var(--muted);font-size:12.5px;margin-top:4px;letter-spacing:-.1px}
.seg{display:flex;background:#11141a;border:1px solid var(--line);border-radius:11px;overflow:hidden;flex:0 0 auto}
.seg button{background:none;color:var(--muted);padding:8px 14px;min-height:0;font-size:12.5px;border-radius:0;
font-weight:600;transition:background .15s ease,color .15s ease}
.seg button.on{background:var(--accent);color:#0f1115}
main{padding:16px 18px calc(var(--sb) + 178px)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:14px 18px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:52px;min-height:68px;border-radius:15px;background:var(--card);
border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
transition:transform .12s ease,background .15s ease,border-color .15s ease}
.day:active{transform:scale(.94)}
.day.sel{background:var(--accent);border-color:var(--accent);color:#0f1115;font-weight:700;
box-shadow:0 4px 14px rgba(124,156,255,.35)}
.day.today:not(.sel){border-color:var(--accent)}
.day .dw{font-size:11px;opacity:.7}.day .dn{font-size:19px;font-weight:700}
.day .dot{width:5px;height:5px;border-radius:50%;background:var(--accent)}
.day.sel .dot{background:#0f1115}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;
box-shadow:0 1px 0 rgba(255,255,255,.02) inset,0 8px 24px -12px rgba(0,0,0,.5)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dotstat{width:8px;height:8px;border-radius:50%;background:var(--red);flex:0 0 auto}
.dotstat.on{background:var(--green)}.dotstat.warn{background:var(--amber)}
select,input,button{font-family:inherit;font-size:15px}
select,input[type=text],input[type=time],input[type=date]{background:#11141a;color:var(--text);
border:1px solid var(--line);border-radius:12px;padding:12px;min-height:46px;width:100%;
transition:border-color .15s ease}
select:focus,input:focus{outline:none;border-color:var(--accent)}
select{margin-top:10px}
button{border:none;border-radius:13px;padding:12px 16px;min-height:46px;font-weight:600;
transition:transform .1s ease,opacity .1s ease}
.btn{background:var(--accent);color:#0f1115}
.btn.ghost{background:#11141a;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:#3a1f22;color:var(--red);border:1px solid #52272c}
.btn.sm{padding:8px 13px;min-height:36px;font-size:12px}
.btn:active{transform:scale(.96);opacity:.85}
.opt{display:flex;align-items:center;gap:9px;margin-top:12px;font-size:13px;color:var(--muted)}
.opt input{width:19px;height:19px;min-height:0;accent-color:var(--accent);flex:0 0 auto}
.hint{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.65}
.fold{margin-top:12px;border-top:1px solid var(--line);padding-top:12px;display:none}
.fold.show{display:block}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.chip{display:flex;align-items:center;gap:6px;background:#11141a;border:1px solid var(--line);
border-radius:20px;padding:7px 12px;font-size:12.5px;min-height:0;transition:transform .1s ease,background .15s ease,border-color .15s ease}
.chip:active{transform:scale(.96)}
.chip .sw{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.chip.on{border-color:var(--accent);background:#232f4d}
.chip .x{color:var(--muted);font-weight:700;padding-left:2px}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--card);
border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:9px;position:relative;overflow:hidden;
transition:opacity .2s ease}
.task .bar{position:absolute;left:0;top:0;bottom:0;width:4px}
.cb{flex:0 0 auto;width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);position:relative;margin-top:1px;
transition:transform .12s ease,background .15s ease,border-color .15s ease}
.cb:active{transform:scale(.88)}
.cb::after{content:"";position:absolute;inset:-11px}
.cb.done{background:var(--green);border-color:var(--green)}
.cb.done::before{content:"✓";position:absolute;inset:0;display:flex;align-items:center;
justify-content:center;color:#0f1115;font-size:15px;font-weight:900}
.tbody{flex:1;min-width:0}
.ttl{font-size:15px;line-height:1.4;word-break:break-word}
.task.done .ttl{text-decoration:line-through;color:var(--muted)}
.meta{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tag{background:#232833;padding:2px 8px;border-radius:6px;font-size:11px}
.tag.g{background:#1e3a2f;color:var(--green)}
.tag.up{background:#232f4d;color:var(--accent);border:none;padding:4px 10px;min-height:0;font-size:11px;font-weight:600;border-radius:6px}
.del{background:none;border:none;color:var(--muted);font-size:20px;padding:0;width:32px;height:32px;min-height:32px;position:relative;flex:0 0 auto}
.del::after{content:"";position:absolute;inset:-8px}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-size:14px;line-height:1.7}
.wkhead{font-size:13px;font-weight:700;color:var(--accent);margin:18px 0 9px;display:flex;
justify-content:space-between;align-items:center}
.wkhead .n{color:var(--muted);font-weight:400;font-size:11px}
.addbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(15,17,21,.96);
backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);
padding:12px calc(18px + var(--sl)) calc(var(--sb) + 14px) calc(18px + var(--sr))}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input[type=time]{flex:0 0 106px}
.addrow button{flex:0 0 auto;padding:12px 18px}
.subjrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.subjrow::-webkit-scrollbar{display:none}
.subjrow .chip{flex:0 0 auto}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
.sheet.show{display:flex}
.sheetbox{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);
border-radius:22px 22px 0 0;padding:22px calc(18px + var(--sl)) calc(var(--sb) + 18px) calc(18px + var(--sr));max-height:88vh;overflow:auto}
.sheetbox h3{margin:0 0 14px;font-size:17px;font-weight:700;letter-spacing:-.2px}
.sheetbox input,.sheetbox select{margin-bottom:10px}
.two{display:flex;gap:10px}
.sheetact{display:flex;gap:10px;margin-top:16px}
.sheetact .btn{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--sb) + 112px);
background:#232833;border:1px solid var(--line);padding:11px 17px;border-radius:13px;font-size:13px;
z-index:60;opacity:0;transition:.25s;pointer-events:none;max-width:84%;text-align:center;
box-shadow:0 8px 24px -8px rgba(0,0,0,.5)}
.toast.show{opacity:1}
.spin{opacity:.55}
.statbox{display:flex;gap:8px;text-align:center}
.statbox div{flex:1;background:#11141a;border:1px solid var(--line);border-radius:13px;padding:10px 4px;
cursor:pointer;transition:transform .1s ease,border-color .15s ease}
.statbox div:active{transform:scale(.95)}
.statbox .n{font-size:1.35em;font-weight:800;display:block;letter-spacing:-.3px}
.statbox .l{font-size:10.5px;color:var(--muted);margin-top:2px;display:block}
.seg.wide{width:100%}
.seg.wide button{flex:1}
.urg{font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;flex:0 0 auto}
.urg.overdue{background:#3a1f22;color:var(--red)}
.urg.today{background:#3a1f22;color:var(--red)}
.urg.tomorrow{background:#3a2e1a;color:var(--amber)}
.urg.week{background:#3a2e1a;color:var(--amber)}
.urg.later{background:#232833;color:var(--muted)}
input[type=color].swpick{-webkit-appearance:none;appearance:none;width:18px;height:18px;padding:0;
border:1px solid rgba(255,255,255,.25);border-radius:50%;overflow:hidden;cursor:pointer;
background:none;min-height:0;flex:0 0 auto}
input[type=color].swpick::-webkit-color-swatch-wrapper{padding:0;border-radius:50%}
input[type=color].swpick::-webkit-color-swatch{border:none;border-radius:50%}
.colorrow{display:flex;align-items:center;gap:8px}
.colorrow input[type=color]{flex:0 0 46px;min-height:46px;padding:4px;background:#11141a;
border:1px solid var(--line);border-radius:12px}
.sectlabel{font-size:12.5px;font-weight:700;color:var(--text);margin-top:18px;padding-top:16px;
border-top:1px solid var(--line);letter-spacing:-.1px}
.sectlabel.first{border-top:none;padding-top:0;margin-top:0}
.iconbtn{width:38px;height:38px;min-height:0;padding:0;border-radius:50%;display:flex;align-items:center;
justify-content:center;background:#11141a;border:1px solid var(--line);color:var(--text);flex:0 0 auto;
transition:transform .1s ease,background .15s ease,color .15s ease,border-color .15s ease}
.iconbtn svg{width:18px;height:18px}
.iconbtn:active{transform:scale(.92)}
.iconbtn.active{background:var(--accent);color:#0f1115;border-color:var(--accent)}
.iconbtn.chevron svg{transition:transform .2s ease}
.iconbtn.chevron.open svg{transform:rotate(180deg)}
.fab{width:48px;height:48px;min-height:0;border-radius:50%;background:var(--accent);color:#0f1115;
display:flex;align-items:center;justify-content:center;flex:0 0 auto;padding:0;
box-shadow:0 6px 18px -4px rgba(124,156,255,.55);transition:transform .1s ease,opacity .1s ease}
.fab svg{width:22px;height:22px}
.fab:active{transform:scale(.92);opacity:.9}
.quickadd{display:flex;gap:10px;margin-top:8px;align-items:center}
.quickadd input[type=text]{border-radius:24px;padding-left:18px}
.quickadd input[type=time]{flex:0 0 92px;border-radius:24px;text-align:center;padding-left:0;padding-right:0}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div><h1>Study Planner</h1><div class="sub" id="streak">กำลังโหลด…</div></div>
    <div class="seg"><button id="vDay" class="on">วัน</button><button id="vWeek">สัปดาห์</button></div>
  </div>
</header>
<div class="strip" id="strip"></div>
<main>
  <div class="card statbox" id="stats">
    <div data-stattab="todo"><span class="n" id="todo-count" style="color:var(--red)">0</span><span class="l">งานค้าง</span></div>
    <div data-stattab="done"><span class="n" id="done-count" style="color:var(--green)">0</span><span class="l">เสร็จแล้ว</span></div>
    <div data-stattab="all"><span class="n" id="total-count">0</span><span class="l">รวม</span></div>
  </div>

  <div class="card">
    <div class="row">
      <strong style="font-size:14px">งานที่เหลือ (เรียงตามความด่วน)</strong>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="hint" style="margin:0" id="dashCount">0 งาน</span>
        <button class="iconbtn chevron open" id="dashToggle" title="ย่อ/ขยาย">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>
      </div>
    </div>
    <div class="fold show" id="dashFold">
      <div class="chips" id="dashSubjChips"></div>
      <div id="dashList" style="margin-top:12px"></div>
    </div>
  </div>

  <div class="card">
    <div class="row">
      <div style="display:flex;align-items:center;gap:8px">
        <span class="dotstat" id="stat"></span><strong style="font-size:14px">การเชื่อมต่อ</strong>
      </div>
      <div style="display:flex;gap:8px">
        <button class="iconbtn" id="gearBtn" title="ตั้งค่า">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <button class="btn ghost sm" id="authBtn">เชื่อมต่อ</button>
      </div>
    </div>
    <div class="hint" id="syncInfo">—</div>

    <div class="fold" id="fold">
      <select id="calSel" style="display:none"></select>
      <label class="opt"><input type="checkbox" id="optMark">ติ๊กเสร็จ → ใส่ ✓ บนปฏิทิน</label>
      <label class="opt"><input type="checkbox" id="optAuto">เพิ่มงานใหม่ → ส่งขึ้นปฏิทินทันที</label>
      <label class="opt"><input type="checkbox" id="optNotify">เปิดแจ้งเตือนเข้า LINE</label>

      <div class="sectlabel first">LINE</div>
      <div class="hint" id="lineInfo">—</div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn ghost sm" id="pairBtn">จับคู่ LINE</button>
        <button class="btn ghost sm" id="testBtn">ส่งทดสอบ</button>
      </div>

      <div class="sectlabel">วิชา</div>
      <div class="hint" style="margin-top:4px">สีในแอปเป็นเรื่องของแอปเท่านั้น จะไม่ถูกส่งไปกำหนดสีบน Google Calendar อีกต่อไป ไม่ว่าวิชาเก่าหรือใหม่</div>
      <div class="chips" id="subjAdmin"></div>
      <div class="colorrow" style="margin-top:10px">
        <input type="text" id="newSubj" placeholder="ชื่อวิชาใหม่" style="margin-top:0">
        <input type="color" id="newColorCustom" value="#7c9cff" title="กำหนดสีเอง">
        <button class="btn sm" id="addSubj" style="flex:0 0 auto">เพิ่ม</button>
      </div>
      <select id="newColor" style="margin-top:8px"></select>
      <div class="hint" style="margin-top:2px">เลือกด่วนจากรายการ หรือกำหนดสีเองด้วยจุดสีด้านบน</div>
    </div>
  </div>
  <div id="list"></div>
</main>

<div class="addbar">
  <div class="subjrow" id="subjPick"></div>
  <div class="quickadd">
    <input type="text" id="newTitle" placeholder="เพิ่มงานใหม่…" autocomplete="off" enterkeyhint="done">
    <input type="time" id="newTime">
    <button class="fab" id="addBtn" title="เพิ่มงาน">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    </button>
  </div>
</div>

<div class="sheet" id="sheet"><div class="sheetbox">
  <h3>แก้ไขงาน</h3>
  <input type="text" id="edTitle" placeholder="ชื่องาน">
  <div class="two"><input type="date" id="edDate"><input type="time" id="edTime"></div>
  <select id="edSubj"></select>
  <label class="opt"><input type="checkbox" id="edDone">ทำเสร็จแล้ว</label>
  <div class="hint" id="edNote"></div>
  <div class="sheetact">
    <button class="btn danger" id="edDel">ลบ</button>
    <button class="btn ghost" id="edCancel">ยกเลิก</button>
    <button class="btn" id="edSave">บันทึก</button>
  </div>
</div></div>

<div class="sheet" id="overviewSheet"><div class="sheetbox">
  <div class="row" style="margin-bottom:14px">
    <h3 style="margin:0">ภาพรวมงาน</h3>
    <button class="btn ghost sm" id="ovClose">ปิด</button>
  </div>
  <div class="seg wide">
    <button id="ovTodo">ค้าง</button>
    <button id="ovDone">เสร็จ</button>
    <button id="ovAll" class="on">รวม</button>
  </div>
  <div id="ovList" style="margin-top:14px"></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
/* ══════ แก้บรรทัดนี้บรรทัดเดียว ══════ */
const API = "https://planner-sync.69200010.workers.dev";

/* ══════ กุญแจ ══════ */
let APP_KEY=localStorage.getItem("sp_key")||"";
if(location.hash.startsWith("#k=")){ APP_KEY=decodeURIComponent(location.hash.slice(3));
  localStorage.setItem("sp_key",APP_KEY); history.replaceState(null,"",location.pathname); }
if(!APP_KEY){ APP_KEY=prompt("ใส่กุญแจเข้าใช้ (APP_KEY)")||""; localStorage.setItem("sp_key",APP_KEY); }

/* ══════ สี ══════ */
const COLORS=[["ฟ้า","#7c9cff",7],["เขียว","#4ade80",10],["ส้ม","#fb923c",6],["ชมพู","#f472b6",4],
["ม่วง","#a78bfa",3],["แดง","#f87171",11],["เหลือง","#fbbf24",5],["เทา","#9aa0aa",8]];

let tasks=JSON.parse(localStorage.getItem("sp_cache")||"[]");
let subjects=[], opts={mark:false,auto:true,notify:true};
let calId=null, connected=false, lineOn=false, editId=null, busy=false;
let selDate=todayKey(), pickSubj=null, view="day", dashSubjFilter=null;

function todayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + 
         String(d.getMonth() + 1).padStart(2, "0") + "-" + 
         String(d.getDate()).padStart(2, "0");
}
const parseKey=k=>{const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
/* ฟังก์ชันที่ renderStreak() เรียกใช้แต่ของเดิมไม่เคยประกาศไว้ — เพิ่มให้ตรงนี้ */
function keyOf(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
/* บังคับให้ทุกวิชาไม่มี colorId ผูกกับ Google Calendar เลย — ไม่ว่าจะเลือกสีอะไรในแอป
   ก็จะไม่ถูกส่งไปกำหนดสีบน Google Calendar อีกต่อไป (ปฏิทินจะใช้สี default เสมอ) */
function stripColorIds(){
  let changed=false;
  subjects.forEach(s=>{ if(s.colorId!=null){ s.colorId=null; changed=true; } });
  return changed;
}
function daysLeft(dateStr){
  const today=new Date(); today.setHours(0,0,0,0);
  return Math.round((parseKey(dateStr)-today)/86400000);
}
function bucketOf(t){
  const d=daysLeft(t.date);
  if(d<0) return "overdue"; if(d===0) return "today"; if(d===1) return "tomorrow";
  if(d<=6) return "week"; return "later";
}
const TH_M=["ม.ค.","ก.พ.","มี.ค.","เม.ย.","พ.ค.","มิ.ย.","ก.ค.","ส.ค.","ก.ย.","ต.ค.","พ.ย.","ธ.ค."];
const TH_D=["อา","จ","อ","พ","พฤ","ศ","ส"];
const TH_DF=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสฯ","ศุกร์","เสาร์"];
const fmtTH=k=>{const d=parseKey(k);return d.getDate()+" "+TH_M[d.getMonth()]};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const subjOf=id=>subjects.find(s=>s.id===id);
const evIdOf=t=>t.src==="gcal"?t.id.slice(5):(t.gcalId||null);

/* สีที่ผู้ใช้ปรับเองในแอป — เก็บไว้ในเครื่องเท่านั้น ไม่ส่งขึ้น backend เด็ดขาด
   จึงไม่มีทางไปกระทบสีบน Google Calendar ได้อีก ไม่ว่า backend จะทำอะไรกับ colorId ก็ตาม */
let colorOverrides = JSON.parse(localStorage.getItem("sp_coloroverrides")||"{}");
function applyColorOverrides(){
  subjects.forEach(s=>{ if(colorOverrides[s.id]) s.color=colorOverrides[s.id]; });
}

let toastT;
function toast(m){const e=document.getElementById("toast");e.textContent=m;e.classList.add("show");
clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove("show"),2800)}

async function api(path,method="GET",body=null){
  if(busy) return null; busy=true; document.body.classList.add("spin");
  try{
    const opt={method,headers:{"x-app-key":APP_KEY}};
    if(body){opt.headers["content-type"]="application/json";opt.body=JSON.stringify(body)}
    const res=await fetch(API+path,opt); const j=await res.json();
    if(j.error) throw new Error(j.error);
    if(j.tasks){ tasks=j.tasks; localStorage.setItem("sp_cache",JSON.stringify(tasks)) }
    return j;
  }catch(e){ toast(e.message||"ต่อเซิร์ฟเวอร์ไม่ได้"); return null }
  finally{ busy=false; document.body.classList.remove("spin") }
}

async function refresh(){
  const s=await api("/api/state");
  if(!s){ setStatus("off","ออฟไลน์ · แสดงข้อมูลที่เก็บไว้"); renderAll(); return }
  connected=s.connected; calId=s.calId; opts=s.opts||opts; subjects=s.subjects||[]; lineOn=s.line;
  applyColorOverrides();
  if(stripColorIds()) api("/api/settings","POST",{subjects});
  optMark.checked=!!opts.mark; optAuto.checked=!!opts.auto; optNotify.checked=opts.notify!==false;
  const sel=document.getElementById("calSel");
  if(s.calendars?.length){ sel.style.display="block"; sel.innerHTML="";
    s.calendars.forEach(c=>{const o=document.createElement("option");
      o.value=c.id;o.textContent=c.name+(c.rw?"":"  (อ่านอย่างเดียว)");sel.appendChild(o)});
    sel.value=calId||""; }
  document.getElementById("lineInfo").textContent = lineOn
    ? "จับคู่แล้ว ✓ · สรุป 07:00 · เตือนก่อนถึงเวลา 1 ชม. · พรีวิวพรุ่งนี้ 20:00"
    : "ยังไม่ได้จับคู่ — กด “จับคู่ LINE” แล้วทักบอทใน LINE";
  if(connected){
    const t=s.lastSync?new Date(s.lastSync).toLocaleString("th-TH",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"—";
    setStatus("ok",`ซิงก์อัตโนมัติทุกชั่วโมงบนเซิร์ฟเวอร์ · ล่าสุด ${t}`);
  }else setStatus("off","ยังไม่ได้เชื่อมต่อ Google · แตะปุ่มเพื่อเริ่ม");
  renderSubjects(); renderAll();
}
function setStatus(kind,msg){
  document.getElementById("stat").className="dotstat"+(kind==="ok"?" on":kind==="warn"?" warn":"");
  document.getElementById("syncInfo").textContent=msg;
  document.getElementById("authBtn").textContent=kind==="ok"?"ซิงก์":"เชื่อมต่อ";
}

/* ══════ วิชา ══════ */
function renderSubjects(){
  const pick=document.getElementById("subjPick");
  pick.innerHTML=`<button class="chip ${pickSubj?"":"on"}" data-pick="">ไม่ระบุวิชา</button>`+
    subjects.map(s=>`<button class="chip ${pickSubj===s.id?"on":""}" data-pick="${s.id}">
      <span class="sw" style="background:${s.color}"></span>${esc(s.name)}</button>`).join("");
  document.getElementById("subjAdmin").innerHTML = subjects.length
    ? subjects.map(s=>`<span class="chip">
      <input type="color" class="swpick" data-subjcolor="${s.id}" value="${s.color}" title="เปลี่ยนสี">
      ${esc(s.name)}<span class="x" data-rmsubj="${s.id}">×</span></span>`).join("")
    : `<span class="hint" style="margin:0">ยังไม่มีวิชา — เพิ่มด้านล่าง</span>`;
  const es=document.getElementById("edSubj");
  es.innerHTML=`<option value="">ไม่ระบุวิชา</option>`+
    subjects.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("");
  const nc=document.getElementById("newColor");
  if(!nc.options.length) COLORS.forEach(([n,c,g])=>{
    const o=document.createElement("option"); o.value=c+"|"+g; o.textContent="● "+n; o.style.color=c; nc.appendChild(o)});
  renderDashChips();
}
function renderDashChips(){
  const el=document.getElementById("dashSubjChips");
  if(!subjects.length){ el.innerHTML=""; return }
  el.innerHTML=`<button class="chip ${dashSubjFilter?"":"on"}" data-dashfilter="">ทั้งหมด</button>`+
    subjects.map(s=>`<button class="chip ${dashSubjFilter===s.id?"on":""}" data-dashfilter="${s.id}">
      <span class="sw" style="background:${s.color}"></span>${esc(s.name)}</button>`).join("");
}
document.getElementById("newColor").onchange=e=>{
  const [c]=e.target.value.split("|");
  document.getElementById("newColorCustom").value=c;
};
document.addEventListener("input",e=>{
  const cp=e.target.closest("[data-subjcolor]"); if(!cp) return;
  const subj=subjects.find(s=>s.id===cp.dataset.subjcolor); if(!subj) return;
  /* เปลี่ยนแค่สีที่โชว์ในแอป เก็บลง localStorage เท่านั้น — ไม่เรียก /api/settings เลย
     เพื่อรับประกันว่าจะไม่มีทางไปกระทบสีของงานที่ซิงก์ขึ้น Google Calendar ได้อีก */
  subj.color=cp.value;
  colorOverrides[subj.id]=cp.value;
  localStorage.setItem("sp_coloroverrides",JSON.stringify(colorOverrides));
  renderSubjects(); renderAll();
});
document.addEventListener("change",e=>{
  const cp=e.target.closest("[data-subjcolor]"); if(!cp) return;
  toast("เปลี่ยนสีในแอปแล้ว (ไม่กระทบ Google Calendar)");
});
document.getElementById("addSubj").onclick=async()=>{
  const n=document.getElementById("newSubj").value.trim(); if(!n) return toast("ใส่ชื่อวิชาก่อน");
  if(subjects.some(s=>s.name===n)) return toast("มีวิชานี้แล้ว");
  const c=document.getElementById("newColorCustom").value;
  subjects.push({id:"s"+Date.now().toString(36),name:n,color:c,colorId:null});
  document.getElementById("newSubj").value="";
  if(await api("/api/settings","POST",{subjects})){ renderSubjects(); toast("เพิ่มวิชาแล้ว") }
};

/* ══════ render ══════ */
function renderStrip() {
  const el = document.getElementById("strip"); el.innerHTML = "";
  const base = new Date(); base.setHours(0,0,0,0);
  const todayKey = base.getFullYear() + "-" + String(base.getMonth()+1).padStart(2,"0") + "-" + String(base.getDate()).padStart(2,"0");

  for(let i=-3; i<=17; i++){
    const d = new Date(base); d.setDate(base.getDate()+i);
    const k = d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    const has = tasks.some(t=>t.date===k);
    const div = document.createElement("div");
    div.className = "day" + (k===selDate ? " sel" : "") + (k===todayKey ? " today" : "");
    div.innerHTML = `<span class="dw">${["อา","จ","อ","พ","พฤ","ศ","ส"][d.getDay()]}</span><span class="dn">${d.getDate()}</span>${has?'<span class="dot"></span>':'<span style="height:5px"></span>'}`;
    div.onclick = () => { selDate=k; renderAll(); };
    el.appendChild(div);
  }
}
function taskHTML(t){
  const s=subjOf(t.subj);
  return `<div class="task ${t.done?'done':''}">
    ${s?`<span class="bar" style="background:${s.color}"></span>`:""}
    <div class="cb ${t.done?'done':''}" data-toggle="${t.id}"></div>
    <div class="tbody" data-edit="${t.id}">
      <div class="ttl">${esc(t.title)}</div>
      <div class="meta">
        ${s?`<span class="tag" style="color:${s.color}">${esc(s.name)}</span>`:""}
        <span>${fmtTH(t.date)}</span>${t.time?`<span>${t.time} น.</span>`:`<span>ทั้งวัน</span>`}
        ${evIdOf(t)?`<span class="tag g">บนปฏิทิน</span>`
                   :`<button class="tag up" data-push="${t.id}">↑ ส่งขึ้นปฏิทิน</button>`}
      </div>
    </div>
    <button class="del" data-del="${t.id}">×</button></div>`;
}
const sortT=a=>a.sort((x,y)=>(x.done-y.done)||((x.time||"99").localeCompare(y.time||"99")));
function renderList(){
  const el=document.getElementById("list");
  if(view==="day"){
    const items=sortT(tasks.filter(t=>t.date===selDate));
    el.innerHTML=items.length?items.map(taskHTML).join("")
      :`<div class="empty">ไม่มีงานวันที่ ${fmtTH(selDate)}<br><span style="font-size:12px">พิมพ์เพิ่มด้านล่าง</span></div>`;
  }else{
    const start=parseKey(selDate); start.setDate(start.getDate()-start.getDay());
    let out="";
    for(let i=0;i<7;i++){
      const d=new Date(start); d.setDate(start.getDate()+i);
      const k=keyOf(d), items=sortT(tasks.filter(t=>t.date===k));
      out+=`<div class="wkhead"><span>${TH_DF[d.getDay()]} ${fmtTH(k)}${k===todayKey()?" · วันนี้":""}</span>
        <span class="n">${items.filter(t=>t.done).length}/${items.length}</span></div>`;
      out+=items.length?items.map(taskHTML).join("")
        :`<div style="color:var(--muted);font-size:12px;padding:4px 0 8px">— ว่าง —</div>`;
    }
    el.innerHTML=out;
  }
}
function renderStreak(){
  let n=0,d=new Date(); d.setHours(0,0,0,0);
  for(let i=0;i<400;i++){ const day=tasks.filter(t=>t.date===keyOf(d));
    if(day.length&&day.every(t=>t.done)){n++;d.setDate(d.getDate()-1)}else break }
  const day=tasks.filter(t=>t.date===selDate);
  document.getElementById("streak").textContent=
    `${fmtTH(selDate)} · เสร็จ ${day.filter(t=>t.done).length}/${day.length}`+(n?` · ต่อเนื่อง ${n} วัน`:"");
}
function updateStats(){
  const done = tasks.filter(t => t.done).length;
  document.getElementById("todo-count").textContent = tasks.length - done;
  document.getElementById("done-count").textContent = done;
  document.getElementById("total-count").textContent = tasks.length;
}
function renderDashboard(){
  let pending = tasks.filter(t=>!t.done);
  if(dashSubjFilter) pending = pending.filter(t=>t.subj===dashSubjFilter);
  document.getElementById("dashCount").textContent = pending.length + " งาน";

  const order=["overdue","today","tomorrow","week","later"];
  const labels={overdue:"เลยกำหนด",today:"วันนี้",tomorrow:"พรุ่งนี้",week:"สัปดาห์นี้",later:"ภายหลัง"};
  const groups={overdue:[],today:[],tomorrow:[],week:[],later:[]};
  pending.forEach(t=>groups[bucketOf(t)].push(t));
  order.forEach(k=>groups[k].sort((a,b)=>(a.date+(a.time||"99")).localeCompare(b.date+(b.time||"99"))));

  let html="";
  order.forEach(k=>{
    if(!groups[k].length) return;
    html+=`<div class="wkhead"><span><span class="urg ${k}">${labels[k]}</span></span><span class="n">${groups[k].length}</span></div>`;
    html+=groups[k].map(taskHTML).join("");
  });
  document.getElementById("dashList").innerHTML = html || `<div class="empty">ไม่มีงานค้างเลย</div>`;
}
function renderOverview(){
  const pending = tasks.filter(t=>!t.done).slice()
    .sort((a,b)=>(a.date+(a.time||"99")).localeCompare(b.date+(b.time||"99")));
  const done = tasks.filter(t=>t.done).slice()
    .sort((a,b)=> b.date.localeCompare(a.date) || (b.time||"").localeCompare(a.time||""));
  const el=document.getElementById("ovList");
  if(ovTab==="todo"){
    el.innerHTML = pending.length ? pending.map(taskHTML).join("") : `<div class="empty">ไม่มีงานค้าง</div>`;
  }else if(ovTab==="done"){
    el.innerHTML = done.length ? done.map(taskHTML).join("") : `<div class="empty">ยังไม่มีงานที่เสร็จ</div>`;
  }else{
    let html="";
    html+=`<div class="wkhead"><span>งานค้าง</span><span class="n">${pending.length}</span></div>`;
    html+=pending.length ? pending.map(taskHTML).join("") : `<div style="color:var(--muted);font-size:12px;padding:4px 0 8px">— ไม่มี —</div>`;
    html+=`<div class="wkhead"><span>เสร็จแล้ว</span><span class="n">${done.length}</span></div>`;
    html+=done.length ? done.map(taskHTML).join("") : `<div style="color:var(--muted);font-size:12px;padding:4px 0 8px">— ไม่มี —</div>`;
    el.innerHTML=html;
  }
}
let ovTab="all";
function syncOvTabs(){
  document.getElementById("ovTodo").classList.toggle("on",ovTab==="todo");
  document.getElementById("ovDone").classList.toggle("on",ovTab==="done");
  document.getElementById("ovAll").classList.toggle("on",ovTab==="all");
}
function openOverview(tab){
  ovTab=tab; syncOvTabs(); renderOverview();
  document.getElementById("overviewSheet").classList.add("show");
}
const closeOverview=()=>document.getElementById("overviewSheet").classList.remove("show");
document.getElementById("ovClose").onclick=closeOverview;
document.getElementById("overviewSheet").onclick=e=>{ if(e.target.id==="overviewSheet") closeOverview(); };
document.getElementById("ovTodo").onclick=()=>{ovTab="todo";syncOvTabs();renderOverview();};
document.getElementById("ovDone").onclick=()=>{ovTab="done";syncOvTabs();renderOverview();};
document.getElementById("ovAll").onclick=()=>{ovTab="all";syncOvTabs();renderOverview();};

function renderAll(){renderStrip();renderList();renderStreak();updateStats();renderDashboard();renderOverview()}

/* ══════ actions ══════ */
document.getElementById("vDay").onclick=()=>{view="day";vDay.classList.add("on");vWeek.classList.remove("on");renderList()};
document.getElementById("vWeek").onclick=()=>{view="week";vWeek.classList.add("on");vDay.classList.remove("on");renderList()};
document.getElementById("gearBtn").onclick=()=>{
  const open=document.getElementById("fold").classList.toggle("show");
  document.getElementById("gearBtn").classList.toggle("active",open);
};

const dashFoldEl=document.getElementById("dashFold"), dashToggleBtn=document.getElementById("dashToggle");
let dashOpen = localStorage.getItem("sp_dashopen");
dashOpen = dashOpen===null ? true : dashOpen==="1";
function applyDashFold(){
  dashFoldEl.classList.toggle("show", dashOpen);
  dashToggleBtn.classList.toggle("open", dashOpen);
}
dashToggleBtn.onclick=()=>{ dashOpen=!dashOpen; localStorage.setItem("sp_dashopen", dashOpen?"1":"0"); applyDashFold(); };
applyDashFold();

document.getElementById("addBtn").onclick=addTask;
document.getElementById("newTitle").addEventListener("keydown",e=>{if(e.key==="Enter")addTask()});
async function addTask(){
  const i=document.getElementById("newTitle"),tm=document.getElementById("newTime");
  const v=i.value.trim(); if(!v) return;
  i.value="";tm.value="";i.blur();
  if(await api("/api/task","POST",{title:v,date:selDate,time:tm.value,subj:pickSubj})) renderAll();
}
document.addEventListener("click",async e=>{
  const pk=e.target.closest("[data-pick]"), rm=e.target.closest("[data-rmsubj]"),
        tg=e.target.closest("[data-toggle]"), dl=e.target.closest("[data-del]"),
        ps=e.target.closest("[data-push]"), ed=e.target.closest("[data-edit]"),
        df=e.target.closest("[data-dashfilter]"), st=e.target.closest("[data-stattab]");
  if(st){ openOverview(st.dataset.stattab); return }
  if(df){ dashSubjFilter=df.dataset.dashfilter||null; renderDashChips(); renderDashboard(); return }
  if(pk){ pickSubj=pk.dataset.pick||null; renderSubjects(); return }
  if(rm){ if(!confirm("ลบวิชานี้?")) return;
    subjects=subjects.filter(s=>s.id!==rm.dataset.rmsubj);
    if(await api("/api/settings","POST",{subjects})){renderSubjects();renderAll()} return }
  if(ps){ e.stopPropagation();
    if(await api("/api/task","PATCH",{id:ps.dataset.push,push:true})){toast("ส่งขึ้นปฏิทินแล้ว ✓");renderAll()} return }
  if(tg){ const t=tasks.find(x=>x.id===tg.dataset.toggle); if(!t) return;
    t.done=!t.done; renderAll();
    if(await api("/api/task","PATCH",{id:t.id,done:t.done})) renderAll(); return }
  if(dl){ removeTask(dl.dataset.del); return }
  if(ed) openEdit(ed.dataset.edit);
});
async function removeTask(id){
  const t=tasks.find(x=>x.id===id); if(!t) return;
  let c=false;
  if(evIdOf(t)) c=confirm("ลบออกจาก Google Calendar ด้วยหรือไม่?\n\nตกลง = ลบทั้งสองที่\nยกเลิก = ลบเฉพาะในแอป");
  if(await api(`/api/task?id=${encodeURIComponent(id)}&cal=${c?1:0}`,"DELETE")) renderAll();
}
const sheet=document.getElementById("sheet");
function openEdit(id){
  const t=tasks.find(x=>x.id===id); if(!t) return;
  editId=id; edTitle.value=t.title; edDate.value=t.date; edTime.value=t.time||"";
  edSubj.value=t.subj||""; edDone.checked=!!t.done;
  document.getElementById("edNote").textContent=evIdOf(t)
    ?"ผูกกับ Google Calendar — บันทึกแล้วอัปเดตบนปฏิทินด้วย":"ยังไม่ได้ส่งขึ้นปฏิทิน";
  sheet.classList.add("show");
}
const closeEdit=()=>{sheet.classList.remove("show");editId=null};
document.getElementById("edCancel").onclick=closeEdit;
sheet.onclick=e=>{if(e.target===sheet)closeEdit()};
document.getElementById("edDel").onclick=()=>{const id=editId;closeEdit();removeTask(id)};
document.getElementById("edSave").onclick=async()=>{
  const id=editId;
  if(!edTitle.value.trim()||!edDate.value) return toast("กรอกชื่องานและวันที่ให้ครบ");
  const b={id,title:edTitle.value,date:edDate.value,time:edTime.value,subj:edSubj.value||null,done:edDone.checked};
  closeEdit();
  if(await api("/api/task","PATCH",b)){toast("บันทึกแล้ว ✓");renderAll()}
};
document.getElementById("authBtn").onclick=async()=>{
  if(connected){const r=await api("/api/sync","POST"); if(r){toast(`ซิงก์แล้ว ${r.count} รายการ`);refresh()}}
  else location.href=API+"/login?k="+encodeURIComponent(APP_KEY);
};
document.getElementById("calSel").onchange=async e=>{
  if(await api("/api/settings","POST",{calId:e.target.value})){toast("เปลี่ยนปฏิทินแล้ว");refresh()}
};
optMark.onchange=optAuto.onchange=optNotify.onchange=async()=>{
  await api("/api/settings","POST",{opts:{mark:optMark.checked,auto:optAuto.checked,notify:optNotify.checked}});
};
document.getElementById("pairBtn").onclick=async()=>{
  if(await api("/api/line/pair","POST"))
    alert("เปิดโหมดจับคู่แล้ว (15 นาที)\n\nตอนนี้ให้เปิด LINE แล้วพิมพ์อะไรก็ได้ส่งไปหาบอทของคุณ\nจากนั้นกลับมากด “ตั้งค่า” เพื่อรีเฟรช");
};
document.getElementById("testBtn").onclick=async()=>{
  const r=await api("/api/line/test","POST"); if(r) toast(r.msg);
};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refresh()});
setInterval(refresh,5*60*1000);
renderSubjects(); renderAll(); refresh();
</script>
